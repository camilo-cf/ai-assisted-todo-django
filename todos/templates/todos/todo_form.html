{% extends 'todos/base.html' %}

{% block content %}
<h2>{% if form.instance.pk %}Edit{% else %}New{% endif %} Todo</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
    <a href="{% url 'todo-list' %}" style="margin-top: 10px; display: inline-block;">Cancel</a>
</form>
{% endblock %}
