{% extends 'todos/base.html' %}

{% block content %}
<h2>Delete Todo</h2>
<p>Are you sure you want to delete "{{ todo.title }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn-danger">Confirm Delete</button>
    <a href="{% url 'todo-list' %}" style="margin-left: 10px;">Cancel</a>
</form>
{% endblock %}
