<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; line-height: 1.6; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        h1 { margin: 0; }
        a { text-decoration: none; color: #007bff; }
        a:hover { text-decoration: underline; }
        .btn { display: inline-block; padding: 8px 16px; background: #007bff; color: white; border-radius: 4px; text-decoration: none; }
        .btn:hover { background: #0056b3; text-decoration: none; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #a71d2a; }
        ul { list-style: none; padding: 0; }
        li { border: 1px solid #eee; padding: 15px; margin-bottom: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .resolved { text-decoration: line-through; color: #888; }
        form { display: flex; flex-direction: column; gap: 10px; max-width: 500px; }
        label { font-weight: bold; }
        input, textarea { padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #218838; }
    </style>
</head>
<body>
    <header>
        <h1><a href="{% url 'todo-list' %}" style="color: inherit; text-decoration: none;">Todo App</a></h1>
        <a href="{% url 'todo-create' %}" class="btn">Add Todo</a>
    </header>
    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
